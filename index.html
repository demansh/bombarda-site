<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#020a02">
  <script>
    (() => {
      const ZONE_PALETTES = [
        { phosphor: [51, 255, 102], background: [2, 10, 2] },
        { phosphor: [255, 176, 0], background: [10, 6, 0] },
        { phosphor: [225, 235, 255], background: [6, 7, 10] },
        { phosphor: [255, 232, 64], background: [10, 9, 0] },
        { phosphor: [255, 70, 40], background: [10, 2, 0] },
        { phosphor: [70, 140, 255], background: [2, 4, 10] },
      ];
      const LEVELS_PER_ZONE = 15;
      const LEVELS_PER_CYCLE = 90;
      const RUN_KEY = "bombarda:run:v3";
      const readSavedZone = () => {
        try {
          const level = JSON.parse(window.localStorage.getItem(RUN_KEY))?.globalLevel;
          return Number.isInteger(level) && level >= 1 ? Math.floor(((level - 1) % LEVELS_PER_CYCLE) / LEVELS_PER_ZONE) + 1 : 0;
        } catch (error) {
          console.warn(`Unable to read ${RUN_KEY}`, error);
          return 0;
        }
      };
      const palette = ZONE_PALETTES[readSavedZone() - 1] ?? ZONE_PALETTES[0];
      const toHex = (rgb) => `#${rgb.map((channel) => channel.toString(16).padStart(2, "0")).join("")}`;
      document.documentElement.style.setProperty("--phosphor-rgb", palette.phosphor.join(", "));
      document.querySelector('meta[name="theme-color"]').content = toHex(palette.background);
    })();
  </script>
